---
# =============================================================================
# Deploy Solrise ERP: clone the repo, render .env from the live AWS facts, build
# the image, bring the stack up against RDS, create the site, and install the
# boot unit + backup schedule.
# =============================================================================

- name: Ensure the Terraform facts are present
  ansible.builtin.assert:
    that:
      - rds_host | default('') | length > 0
      - db_secret_arn | default('') | length > 0
      - site_name | default('') | length > 0
      - domain | default('') | length > 0
    fail_msg: >-
      group_vars/all/terraform.yml is missing or incomplete.
      Run `terraform apply` in infra/terraform first.

- name: Read the RDS master credentials on the host (its instance role has them)
  # Runs on the target, not the control node: the EC2 instance profile already
  # carries secretsmanager:GetSecretValue for this one secret (terraform/iam.tf),
  # so the workstation needs no AWS Secrets Manager access - and which credentials
  # happen to be exported in your shell stops mattering.
  #
  # `failed_when: false` + the assert below is deliberate: this task is `no_log`
  # (the stdout is the password), and a plain failure here would be reported as
  # "output has been hidden due to no_log", which is undebuggable. The assert
  # re-raises only the exit code and stderr, neither of which contains a secret.
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        import boto3
        client = boto3.client("secretsmanager", region_name=sys.argv[1])
        print(client.get_secret_value(SecretId=sys.argv[2])["SecretString"])
      - "{{ aws_region }}"
      - "{{ db_secret_arn }}"
  register: rds_secret_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: Fail with a readable message when the RDS secret could not be read
  ansible.builtin.assert:
    that:
      - rds_secret_raw.rc | default(1) == 0
      - rds_secret_raw.stdout | default('') | length > 0
    fail_msg: >-
      The host could not read {{ db_secret_arn }} (exit {{ rds_secret_raw.rc | default('?') }}):
      {{ rds_secret_raw.stderr | default('') | truncate(300) }}
      The instance role needs secretsmanager:GetSecretValue on that secret
      (`terraform apply` in infra/terraform attaches it) and python3-boto3 on the host.

- name: Parse the RDS master credentials
  ansible.builtin.set_fact:
    rds_secret: "{{ rds_secret_raw.stdout | from_json }}"
  no_log: true

- name: Choose the image source (a configured registry image, else ECR, else build here)
  ansible.builtin.set_fact:
    # Precedence: `custom_image` when set (Docker Hub by default - what CI pushes
    # to), otherwise the ECR repository Terraform created. With neither, the
    # fallback is to build on the host via `make image` + rebuild_image: true.
    effective_image: "{{ custom_image if (custom_image | default('') | length > 0) else (ecr_repository_url | default('')) }}"
    # True when the image comes from a registry at all; false means build here.
    pull_image: "{{ (custom_image | default('') | length > 0) or (ecr_repository_url | default('') | length > 0) }}"
    # `always` so a registry tag that CI moved is really re-fetched. It only
    # matters for the build-locally fallback otherwise.
    effective_pull_policy: "{{ 'always' if ((custom_image | default('') | length > 0) or (ecr_repository_url | default('') | length > 0)) else 'missing' }}"
    effective_backup_dir: "{{ backup_dir | default('') if (backup_dir | default('') | length > 0) else app_dir + '/backups' }}"
    # cloud_storage ships in the image; it is only installed on the site when
    # there is a media bucket to talk to (and only then is it configured).
    # solrise_erp is the Solrise application layer (white labeling, RBAC, the
    # assistant, universal chat, reports); its own verification task below uses
    # the same flag.
    effective_install_apps: "{{ install_apps }}{{ ',solrise_erp' if (solrise_app_enabled | default(true) | bool) else '' }}{{ ',cloud_storage' if (s3_media_enabled | default(false) | bool and media_bucket | default('') | length > 0) else '' }}"
    effective_s3_endpoint_url: "{{ s3_media_endpoint_url if (s3_media_endpoint_url | default('') | length > 0) else 'https://s3.' + aws_region + '.amazonaws.com' }}"

# Whether the host has to authenticate to Docker Hub before pulling: only for a
# docker.io image (not ECR), and only when the vault actually carries a token
# pair - a public image needs no login.
- name: Decide whether the host must log in to Docker Hub
  ansible.builtin.set_fact:
    dockerhub_login_needed: >-
      {{ (effective_image is match('^docker.io/'))
         and (dockerhub_username | default('') | length > 0)
         and (dockerhub_password | default('') | length > 0) }}

# RDS lives in a private subnet: only the app host can reach it, so probe from
# the target, not the control node.
- name: Wait for RDS to accept connections
  ansible.builtin.wait_for:
    host: "{{ rds_host }}"
    port: "{{ rds_port }}"
    timeout: 120

- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  become: true

- name: Clone or update the repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    version: "{{ repo_version }}"
    dest: "{{ app_dir }}"
    accept_hostkey: true
    update: true
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"

- name: Make the helper scripts executable
  ansible.builtin.file:
    path: "{{ app_dir }}/scripts/{{ item }}"
    mode: "0755"
  loop:
    - build-image.sh
    - create-site.sh
    - backup.sh
    - restore.sh
    - run-python.sh
    - setup-media.sh
    - export-fixtures.sh
    - pull-fixtures.sh
    - bootstrap-vps.sh
  become: true
  become_user: "{{ deploy_user }}"

- name: Render the production .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  vars:
    db_root_password: "{{ rds_secret.password }}"
    db_root_username_effective: "{{ rds_secret.username | default(db_root_username) }}"
    admin_password: "{{ vault_admin_password }}"
  no_log: true

# --- image -------------------------------------------------------------------
- name: Log in to ECR
  ansible.builtin.shell: >-
    aws ecr get-login-password --region {{ aws_region }}
    | podman login --username AWS --password-stdin {{ ecr_repository_url.split('/')[0] }}
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
  when:
    - ecr_repository_url | default('') | length > 0
    - effective_image == ecr_repository_url
  changed_when: false

- name: Log in to Docker Hub (needed when the image repository is private)
  # The password goes in over stdin, never as a command-line argument, so only
  # `podman`'s own output needs hiding. `failed_when: false` + the assert below
  # turn a wrong or expired token into a readable message instead of a censored
  # "output has been hidden due to no_log".
  ansible.builtin.command:
    cmd: podman login --username "{{ dockerhub_username }}" --password-stdin docker.io
    stdin: "{{ dockerhub_password }}\n"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
  register: dockerhub_login
  changed_when: false
  failed_when: false
  no_log: true
  when: dockerhub_login_needed | bool

- name: Fail with a readable message when the Docker Hub login failed
  ansible.builtin.assert:
    that:
      - dockerhub_login.rc | default(1) == 0
    fail_msg: >-
      podman login to docker.io failed (exit {{ dockerhub_login.rc | default('?') }}):
      {{ dockerhub_login.stderr | default('') | truncate(300) }}
      Check dockerhub_username / dockerhub_password in group_vars/all/vault.yml
      (the image {{ effective_image }} is private, so the host must authenticate).
  when: dockerhub_login_needed | bool

- name: Pull the pre-built image from the registry
  ansible.builtin.command:
    cmd: "podman pull {{ effective_image }}:{{ custom_tag }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
  when: pull_image | bool
  changed_when: true

- name: Build the Solrise image (slow - bakes erpnext + hrms + the custom app)
  ansible.builtin.command:
    cmd: make image
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
  register: image_build
  async: 5400
  poll: 30
  when:
    - not (pull_image | bool)
    - rebuild_image | bool
  changed_when: "'built' in image_build.stdout"

# --- stack -------------------------------------------------------------------
# `make aws-up` is not a plain `up -d`: it also force-recreates the app
# containers. A re-pushed image keeps its tag - only the digest changes - and
# podman-compose compares service config, not the digest, so without that step the
# host would keep running the previous image and the pulled tag would go unused.
- name: Start the stack and roll out the pulled image (Traefik, redis, app containers)
  ansible.builtin.command:
    cmd: make aws-up
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
  changed_when: true

- name: Create the site and apply programmatic configuration (idempotent)
  ansible.builtin.command:
    cmd: ./scripts/create-site.sh
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
  when: run_site_setup | bool
  register: site_setup
  changed_when: "'site setup complete' in site_setup.stdout or 'create-site: done' in site_setup.stdout"

# --- caches after a rollout ---------------------------------------------------
# A rollout recreates the app containers on the new image but deliberately leaves
# Redis running, so Frappe keeps the *previous* image's cached asset manifest
# (`assets_json`). Every page then asks for `/assets/**.css` names that no longer
# exist, nginx answers with its HTML fallback, the browser refuses the sheet, and
# the site renders with no CSS at all. Clearing the cache re-reads the manifest
# from the image.
- name: Clear the site cache so the new image's asset manifest is picked up
  ansible.builtin.command:
    cmd: ./scripts/clear-cache.sh
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
  when: not ansible_check_mode
  changed_when: false

# --- application layer (white labeling, assistant, chat) ----------------------
# With `solrise_app_enabled: true` the site setup above installs solrise_erp and
# its `after_migrate` applies branding, RBAC, workflows, notifications, reports
# and dashboards. This turns "the deploy delivered the product" into a checked
# fact: it reads the values the app writes and fails the run when they are
# missing.
- name: Verify the Solrise application layer (white labeling, chat, RBAC artifacts)
  ansible.builtin.command:
    cmd: ./scripts/run-python.sh scripts/verify_app_layer.py
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
  when:
    - run_site_setup | bool
    - solrise_app_enabled | default(true) | bool
  changed_when: false
  register: app_layer

- name: Report the application layer
  ansible.builtin.debug:
    msg: "{{ app_layer.stdout_lines }}"
  when: app_layer.stdout_lines is defined

# --- application layer without the app (interim) ------------------------------
# While the app's source is unavailable (`solrise_app_enabled: false`) the same
# features are delivered from this repository and from the app's *exported*
# fixtures: the DocType half of the white labeling, the RBAC matrix, the module
# settings, the Issue SLA and the routing rule, plus the workflow, notification,
# report and dashboard records. What that leaves out is listed in
# docs/16-deployment-pipeline-status.md section 5.4.
- name: Apply white-label branding without the app (interim)
  ansible.builtin.command:
    cmd: ./scripts/run-python.sh scripts/branding_only.py
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
    BRANDING_RENAME_COMPANY: "1"
  when:
    - run_site_setup | bool
    - not (solrise_app_enabled | default(true) | bool)
  changed_when: false
  register: branding_lite

- name: Import the app fixtures that need no app (interim)
  ansible.builtin.command:
    cmd: ./scripts/import_app_fixtures.sh
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
  when:
    - run_site_setup | bool
    - not (solrise_app_enabled | default(true) | bool)
  changed_when: false
  register: app_fixtures

- name: Report the interim application layer
  ansible.builtin.debug:
    msg: "{{ (branding_lite.stdout_lines | default([])) + (app_fixtures.stdout_lines | default([])) }}"
  when: branding_lite.stdout_lines is defined or app_fixtures.stdout_lines is defined

# --- media (S3) --------------------------------------------------------------
# Points the site's file storage at the S3 media bucket, proves the instance
# profile can actually read and write it, and (opt-in) migrates files that are
# still on the volume. Idempotent: safe on every deploy.
- name: Configure S3 media storage (site config, credentials check, optional migration)
  ansible.builtin.command:
    cmd: ./scripts/setup-media.sh
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    HOME: "{{ deploy_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    SITE_ENV: aws
  when:
    - s3_media_enabled | default(false) | bool
    - media_bucket | default('') | length > 0
  register: media_setup
  changed_when: "'site config: updated' in media_setup.stdout"

# --- boot unit ---------------------------------------------------------------
- name: Ensure the user systemd directory exists
  ansible.builtin.file:
    path: "{{ deploy_home }}/.config/systemd/user"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  become: true

- name: Install the boot unit (rootless podman-compose)
  ansible.builtin.template:
    src: solrise.service.j2
    dest: "{{ deploy_home }}/.config/systemd/user/solrise.service"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  become: true
  notify:
    - reload user systemd
    - restart solrise

- name: Enable the service
  ansible.builtin.command: systemctl --user enable solrise.service
  become: true
  become_user: "{{ deploy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ deploy_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ deploy_uid }}/bus"
  # `systemctl enable` is idempotent; report it as such rather than always changed.
  changed_when: false

# --- backups -----------------------------------------------------------------
- name: Schedule the daily backup
  ansible.builtin.cron:
    name: solrise-backup
    user: "{{ deploy_user }}"
    hour: "{{ backup_hour }}"
    minute: "{{ backup_minute }}"
    cron_file: solrise-backup
    job: >-
      env XDG_RUNTIME_DIR=/run/user/{{ deploy_uid }}
      bash -lc 'cd {{ app_dir }} && SITE_ENV=aws BACKUP_DIR={{ effective_backup_dir }}
      ./scripts/backup.sh >> {{ app_dir }}/backups/backup.log 2>&1'
  when: backup_cron_enabled | bool

- name: Schedule the off-box sync to S3
  ansible.builtin.cron:
    name: solrise-backup-s3
    user: "{{ deploy_user }}"
    hour: "{{ backup_hour }}"
    minute: "{{ (backup_minute | int) + 30 }}"
    cron_file: solrise-backup-s3
    job: >-
      aws s3 sync {{ effective_backup_dir }} s3://{{ backup_bucket }}/files/
      --region {{ aws_region }} >> {{ app_dir }}/backups/backup.log 2>&1
  when:
    - backup_s3_enabled | bool
    - backup_bucket | default('') | length > 0

# --- verify ------------------------------------------------------------------
- name: Wait for the app to answer over HTTPS
  ansible.builtin.uri:
    url: "https://{{ site_name }}/api/method/ping"
    validate_certs: true
    status_code: 200
  delegate_to: localhost
  become: false
  register: app_ping
  until: app_ping.status == 200
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: Report the deployment
  ansible.builtin.debug:
    msg:
      - "Solrise ERP deployed: https://{{ site_name }}"
      - "Database: RDS MariaDB at {{ rds_host }}:{{ rds_port }} (user {{ db_root_username }})"
