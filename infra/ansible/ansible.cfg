[defaults]
# Static inventory is rendered by Terraform (inventory/hosts.ini).
# To discover hosts by their Role=solrise-app tag instead, run with:
#   ansible-playbook -i inventory/aws_ec2.yml site.yml
inventory           = inventory/hosts.ini
roles_path          = roles
collections_path    = ./collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking   = False
retry_files_enabled = False
interpreter_python  = auto_silent
stdout_callback     = default
result_format       = yaml
callbacks_enabled   = profile_tasks, timer
forks               = 5
deprecation_warnings = False

# One place holds the vault passphrase, and Ansible reads it from there: this
# makes `ansible-playbook site.yml` work without `--ask-vault-pass`. `~` is
# expanded per operator, so the setting itself is portable. `--ask-vault-pass`
# still overrides it when you would rather type the passphrase.
vault_password_file = ~/.vault_pass

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
