[project]
name = "solrise_erp"
requires-python = ">=3.10"
description = "Solrise ERP — white labeling, RBAC, notifications, reporting, the LLM assistant and the universal chat entry flow."
authors = [{ name = "Solrise", email = "daniyalbphq@gmail.com" }]
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
