# =============================================================================
# Build the Solrise ERP image in CI and push it to Docker Hub.
#
# Runs on every change to the app list or the build machinery on `main`, or by
# hand:
#   gh workflow run build-image.yml -f tag=version-15
#
# Ansible only *pulls* the image on the host (CUSTOM_IMAGE:CUSTOM_TAG in .env),
# so the slow bake (frappe + erpnext + hrms + the Solrise app + cloud_storage)
# never runs on production. Authentication is a Docker Hub personal access token
# kept as a repository secret - no AWS credentials, no long-lived registry
# password.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets (preferred - stored encrypted and masked in logs):
#     DOCKERHUB_USERNAME   Docker Hub account/org that owns the image
#     DOCKERHUB_TOKEN      personal access token with Read & Write scope
#     SOLRISE_APP_URL      REQUIRED: apps.json bakes the Solrise application
#                          layer (white labeling, RBAC, assistant, chat,
#                          reports) from this git remote. Use
#                          https://x-access-token:<PAT>@github.com/<owner>/<app>
#                          when that repository is private. The build fails
#                          without it rather than shipping a bare ERPNext.
#   Variables (optional; the same names are accepted as a fallback, but they are
#   stored in plaintext and are NOT masked in logs - use Secrets for the token):
#     DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#     CUSTOM_IMAGE         docker.io/<DOCKERHUB_USERNAME>/solrise
#     CUSTOM_TAG           version-15   (must match custom_tag in
#                                       infra/ansible/group_vars/all/main.yml)
#     FRAPPE_BRANCH        version-15
#     SOLRISE_APP_BRANCH   main         (must match solrise_app_branch in
#                                       infra/ansible/group_vars/all/main.yml)
#
# The token steps are in infra/PREREQUISITES.md section 4.
# =============================================================================

name: build-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and push
        required: false
        default: version-15
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "apps.example.json"
      - "scripts/build-image.sh"
      - "scripts/push-image.sh"
      - "scripts/apps-fingerprint.py"
      - "infra/image/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DOCKER_BUILDKIT: "1"
      # The image name follows the account that owns the token, so nothing has
      # to be configured for the common case. Set the CUSTOM_IMAGE variable to
      # push somewhere else (another namespace, or a private registry).
      CUSTOM_IMAGE: ${{ vars.CUSTOM_IMAGE || format('docker.io/{0}/solrise', secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME) }}
      CUSTOM_TAG: ${{ inputs.tag != '' && inputs.tag || vars.CUSTOM_TAG || 'version-15' }}
      FRAPPE_BRANCH: ${{ vars.FRAPPE_BRANCH || 'version-15' }}
      # Must match solrise_app_branch in infra/ansible/group_vars/all/main.yml.
      SOLRISE_APP_BRANCH: ${{ vars.SOLRISE_APP_BRANCH || 'main' }}

    steps:
      - name: Guard the required registry credentials
        run: |
          set -euo pipefail
          missing=""
          [ -n "${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}" ]       || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository credentials:$missing - add them as Actions *secrets* (Settings -> Secrets and variables -> Actions -> Secrets), see infra/PREREQUISITES.md section 4.2"
            exit 1
          fi
          if [ -z "${CUSTOM_IMAGE}" ]; then
            echo "::error::CUSTOM_IMAGE resolved to an empty value - set the CUSTOM_IMAGE variable or the DOCKERHUB_USERNAME secret"
            exit 1
          fi
          if [ -n "${{ vars.DOCKERHUB_TOKEN }}" ] && [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::warning title=Use a secret for the token::DOCKERHUB_TOKEN is a repository VARIABLE: repository variables are stored in plaintext and are not masked in logs. This run will work, but move it to Secrets (Settings -> Secrets and variables -> Actions -> Secrets) and delete the variable."
          fi
          echo "Building ${CUSTOM_IMAGE}:${CUSTOM_TAG} (frappe ${FRAPPE_BRANCH})"

      - name: Check out the repository
        uses: actions/checkout@v4

      # The bake pulls the frappe base/build images and writes a multi-GB image;
      # the toolchains the runner preinstalls are not needed and get in the way.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

      - name: Write .env for the build
        env:
          SOLRISE_APP_URL: ${{ secrets.SOLRISE_APP_URL }}
        run: |
          set -euo pipefail
          # apps.json bakes the Solrise application layer - white-label branding,
          # RBAC, approval workflows, notifications, reports, the LLM assistant
          # and the universal chat - from ${SOLRISE_APP_URL}. An unset value would
          # otherwise fail deep inside the build (or, worse, be mistaken for a
          # deliberate "ship without the app"), so fail here with the fix.
          if grep -qF '${SOLRISE_APP_URL}' apps.json && [ -z "${SOLRISE_APP_URL}" ]; then
            echo "::error title=SOLRISE_APP_URL is not set::apps.json bakes the Solrise application layer from \${SOLRISE_APP_URL} (white labeling, RBAC, assistant, chat, reports). Add the SOLRISE_APP_URL secret for the app repository - https://x-access-token:<PAT>@github.com/<owner>/<app> when it is private - or remove that entry from apps.json (and solrise_erp from install_apps) to ship without the app layer."
            exit 1
          fi
          # The scripts *source* this file (set -a; . ./.env), so every value with
          # a space has to be quoted: `COMPOSE_CMD=docker compose` unquoted would
          # be read as an assignment followed by the command `compose`.
          cat > .env <<EOF
          CONTAINER_ENGINE=docker
          COMPOSE_CMD="docker compose"
          CUSTOM_IMAGE=${CUSTOM_IMAGE}
          CUSTOM_TAG=${CUSTOM_TAG}
          FRAPPE_PATH=https://github.com/frappe/frappe
          FRAPPE_BRANCH=${FRAPPE_BRANCH}
          FRAPPE_IMAGE_PREFIX=docker.io/frappe
          SOLRISE_APP_URL="${SOLRISE_APP_URL}"
          SOLRISE_APP_BRANCH=${SOLRISE_APP_BRANCH}
          SITE_NAME=erp.example.com
          EOF

      - name: Build the image
        run: ./scripts/build-image.sh

      - name: Push the image to Docker Hub
        run: ./scripts/push-image.sh

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${CUSTOM_IMAGE}:${CUSTOM_TAG}"
            echo '```'
            echo ""
            echo "Deploy with: \`ansible-playbook infra/ansible/site.yml --ask-vault-pass\`"
            echo "(the host pulls \`CUSTOM_IMAGE\`/\`CUSTOM_TAG\` from the .env Ansible renders)"
          } >> "$GITHUB_STEP_SUMMARY"
