# =============================================================================
# Solrise ERP - LOCAL testing stack (rootless Podman / podman-compose)
#
#   podman-compose -f compose/compose.local.yaml --env-file .env up -d
#   ./scripts/create-site.sh
#   open http://localhost:8080
#
# Same image and service topology as production, minus Traefik/TLS, so a local
# pass is a real rehearsal of the prod bring-up. Service commands mirror
# frappe_docker's own compose.yaml: the production image's entrypoint links
# assets and then execs the command, and the backend uses the image CMD
# (start.sh -> gunicorn) driven by the GUNICORN_* variables.
# =============================================================================

x-image: &image
  image: ${CUSTOM_IMAGE:-solrise/erpnext}:${CUSTOM_TAG:-version-15}
  pull_policy: ${PULL_POLICY:-missing}

x-backend: &backend
  <<: *image
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # ---------------------------------------------------------------- database --
  mariadb:
    image: docker.io/mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------------- redis --
  redis-cache:
    image: docker.io/redis:8.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: docker.io/redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ configurator --
  # Writes common_site_config.json once, then exits 0.
  configurator:
    <<: *image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g developer_mode 1;
        echo "configurator: common_site_config.json written";
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "${SOCKETIO_PORT:-9000}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # ----------------------------------------------------------------- backend --
  # No command: the image CMD runs start.sh, which boots gunicorn on :8000.
  backend:
    <<: *backend
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  # --------------------------------------------------------------- websocket --
  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  # ----------------------------------------------------------------- workers --
  queue-short:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *backend
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: *backend
    command: ["bench", "schedule"]

  # ---------------------------------------------------------------- frontend --
  # nginx-entrypoint.sh renders /etc/nginx/conf.d/frappe.conf from these env
  # vars, then starts nginx and proxies to backend + websocket.
  frontend:
    <<: *image
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "${PROXY_READ_TIMEOUT:-120}"
      CLIENT_MAX_BODY_SIZE: "${CLIENT_MAX_BODY_SIZE:-50m}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  # ------------------------------------------------------------- create-site --
  # Not started by a plain `up`. Run explicitly:
  #   podman-compose ... --profile init run --rm create-site
  create-site:
    <<: *backend
    profiles: ["init"]
    # A one-shot must never restart: it inherits `restart: unless-stopped` from
    # *backend, so a compose tool that ignores `profiles:` (podman-compose 1.0.6
    # does) starts it, it exits, and it is started again forever.
    restart: "no"
    # bash -c is required: the image ENTRYPOINT execs its argv, so without
    # this the script string would be treated as a program name.
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INSTALL_APPS: ${INSTALL_APPS:-erpnext hrms}
    command:
      - >
        set -e;
        if [ -d "sites/$$SITE_NAME" ]; then echo "site $$SITE_NAME already exists - skipping creation"; else
        bench new-site --mariadb-root-password "$$DB_ROOT_PASSWORD" --admin-password "$$ADMIN_PASSWORD" --no-mariadb-socket "$$SITE_NAME";
        for app in $${INSTALL_APPS//,/ }; do echo "installing $$app"; bench --site "$$SITE_NAME" install-app "$$app"; done;
        bench --site "$$SITE_NAME" set-config developer_mode 1;
        bench --site "$$SITE_NAME" enable-scheduler;
        fi;
        bench use "$$SITE_NAME";
        echo "create-site: done";

volumes:
  sites:
    name: ${SITES_VOLUME:-solrise_sites}
  db-data:
    name: ${DB_VOLUME:-solrise_db_data}
  redis-queue-data:
    name: ${REDIS_QUEUE_VOLUME:-solrise_redis_queue}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-solrise}_net
